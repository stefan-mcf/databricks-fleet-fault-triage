[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fleet-fault-triage"
version = "0.1.0"
description = "Recorded truck-fault classification and reviewed investigation evidence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "mlflow>=3.17,<4",
  "databricks-sdk>=0.156,<1",
  "threadpoolctl>=3.6,<4",
  "pydantic>=2.12,<3",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
azure = [
  "azure-identity>=1.25,<2",
  "azure-ai-projects>=2.2,<2.8",
  "azure-search-documents>=11.6,<12",
  "agent-framework-foundry>=1.15,<2",
  "azure-ai-evaluation>=1.15,<2",
  "azure-storage-blob>=12.23,<13",
]

[project.scripts]
fft = "fleet_fault_triage.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pyyaml>=6,<7",
    "regex>=2025,<2027",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_fault_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
